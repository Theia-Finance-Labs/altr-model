name: Build, Push, and Deploy Kedro Viz

on:
  push:
    branches:
      - main

# Permissions needed for Workload Identity Federation
permissions:
  id-token: write   # To request the OIDC token
  contents: read    # To checkout the repository

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GIT_SHA: ${{ github.sha }}
      IMAGE_BASE: europe-west3-docker.pkg.dev/cloud-1in1000/crispy-app/kedro-viz
      REGION: europe-west3
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud via WIF
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/350220397525/locations/global/workloadIdentityPools/github-pool/providers/theia"
          service_account: "github-ci@cloud-1in1000.iam.gserviceaccount.com"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker europe-west3-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          docker build -t ${IMAGE_BASE}:${GIT_SHA} -f Dockerfile .
          docker push ${IMAGE_BASE}:${GIT_SHA}
          # Optional: Push 'latest' tag as well
          docker tag ${IMAGE_BASE}:${GIT_SHA} ${IMAGE_BASE}:latest
          docker push ${IMAGE_BASE}:latest

      - name: Deploy Cloud Run Service
        run: |
          gcloud run services update kedro-viz \
            --image=${IMAGE_BASE}:${GIT_SHA} \
            --region=${REGION} \
            --cpu=2 \
            --memory=2Gi \
            --cpu-boost \
            --timeout=900
