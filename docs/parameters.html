ameters_reporting.yml", "value": "0.001", "line": 67, "meaning": "QC threshold (× 1_000_000 USD) for flagging tiny residuals; despite the name nothing is rounded", "unit": "float", "default": "0.001", "source": "—", "status": "reporting", "tier": "reporting"}];const list=document.getElementById('list'),q=document.getElementById('q'),count=document.getElementById('count');
const f={tier:'',status:''};const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function sclass(s){return /dead|unreach/i.test(s)?'s-dead':/gated/i.test(s)?'s-gated':''}
function render(){const t=q.value.toLowerCase();let n=0;list.innerHTML=P.filter(p=>{
 if(f.tier&&p.tier!==f.tier)return false;
 if(f.status==='gated'&&!/gated/i.test(p.status))return false;
 if(f.status==='dead'&&!/dead|unreach/i.test(p.status))return false;
 return !t||[p.key,p.meaning,p.source,p.unit,p.status,p.file].join(' ').toLowerCase().includes(t)}).map(p=>{n++;return `<div class="row"><div class="top"><span class="k">${esc(p.key)}</span><span class="v">${esc(p.value)}</span><span class="tag t-${p.tier}">${p.tier}</span><span class="tag ${sclass(p.status)}">${esc(p.status.split(/\s|—/)[0])}</span></div><div class="m">${esc(p.meaning)}</div><div class="d"><b>unit</b><span>${esc(p.unit)}</span><b>default</b><span>${esc(p.default)}</span><b>source</b><span>${esc(p.source)}</span><b>status</b><span>${esc(p.status)}</span><b>file</b><span>${esc(p.file)}:${p.line}</span></div></div>`}).join('');
 count.textContent=n+' of '+P.length+' parameters';}
list.addEventListener('click',e=>{const r=e.target.closest('.row');if(r)r.classList.toggle('open')});
q.addEventListener('input',render);
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{const k=c.dataset.f,v=c.dataset.v;
 if(k==='tier'){f.tier=v;document.querySelectorAll('.chip[data-f=tier]').forEach(x=>x.classList.toggle('on',x.dataset.v===v))}
 else{f.status=f.status===v?'':v;document.querySelectorAll('.chip[data-f=status]').forEach(x=>x.classList.toggle('on',x.dataset.v===f.status))}
