# Reporting pipeline parameters
reporting:
  basis: "real"            # must match earnings/DCF
  base_year: 2010
  baseline_filter:
    scenario_provider: "AR6_WITCH 5.0"  # Match your existing naming convention
    scenario: "AR6_WITCH 5.0_EN_INDCi2030_1000_NDCp"  # Your baseline scenario name
    scenario_type: "baseline"
  top_n_assets_per_company: 10
  top_n_companies: 50
  show_synthetic_assets: false
  
  # plotting toggles
  plots:
    save_png: true
    save_pdf: true
    dpi: 160
    width_in: 10
    height_in: 6
  
  # thresholds & styles
  materiality_threshold_usd: 1_000_000
  small_numbers_rounding: 0.001
  
  # sensitivity (optional)
  show_sensitivity_tornado: true
  sensitivity_params: ["power_price_excarbon_usd_per_mwh", "carbon_price_usd_per_tco2", "capex_usd_per_mw", "capacity_factor"]