    "WindCap - Offshore": 0.98

# Price ramp (RC4 fix): blend baseline->target prices over [shock_year, alignment_year]
# instead of hard-switching at shock_year. Eliminates near-term price windfall where
# target prices are 30-50% higher than baseline at shock year.
price_ramp: True  # RC4 fix: blend baseline->target prices over [shock_year, alignment_year]

# Cost element switches for earnings model
include_growth_capex: False        # OFF: IAM O&M already bundles annualized capital costs (REMIND/WITCH/POLES)
include_replacement_capex: True    # Include CapEx for replacing retired eligible assets
include_decom_costs: True          # Include decommissioning costs for retired assets

# Frozen capacity feature - continued O&M costs on stranded capacity
apply_continued_om_baseline: False  # Apply continued O&M costs to baseline trajectories
apply_continued_om_shock: True      # Apply continued O&M costs to shock trajectories

# Dynamic marginal emission factor (RC5 fix)
# When True, marginal_EF declines over time proportional to VRE capacity share,
# modeling the merit order evolution where renewables displace fossils from the
# marginal position. This causes gas/coal to face increasing differential carbon
# costs as the carbon rent from high-EF marginal generators disappears.
# Formula: marginal_ef(t) = marginal_ef_static * (1 - vre_share(t))^2
# Quadratic decay: gas starts paying at ~34% VRE (linear would be 56%).
dynamic_marginal_ef: True  # RC5 fix: marginal EF declines with VRE share, gas faces rising carbon costs
