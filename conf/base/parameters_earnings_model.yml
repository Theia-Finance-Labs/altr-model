# Earnings model parameters
market_passthrough: 0  # 0.5 => 50% carbon price passthrough to market prices

# Cost element switches for earnings model
include_growth_capex: False        # Include growth CapEx for new buildout capacity
include_replacement_capex: False  # Include CapEx for replacing retired eligible assets
include_decom_costs: False        # Include decommissioning costs for retired assets

# Frozen capacity feature - use capacity at retirement time for fixed costs (continued O&M costs)
# Similar to retirement parameters, you can control whether to apply to baseline and/or shock scenarios
apply_continued_om_baseline: False  # Apply continued O&M costs (frozen capacity) to baseline trajectories
apply_continued_om_shock: True      # Apply continued O&M costs (frozen capacity) to shock (late sudden) trajectories

