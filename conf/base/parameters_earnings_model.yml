# =============================================================================
# Advanced — earnings_model. Leave alone unless you know why.
# User-facing knobs (enable_mcpr, mcpr_mode, carbon_cost_method,
# market_passthrough, price_ramp, include_* capex switches) are in
# conf/base/parameters.yml.
# =============================================================================
#
# MCPR background: in wholesale electricity markets every generator receives
# the clearing price set by the marginal plant. IAM "prices" approximate LCOE.
# MCPR derives a reference clearing price and applies value factors.
# References: Hirth 2013 Energy Econ 38:218-236; Halttunen et al. 2022 Nat
# Energy 7:1154-1164; Ueckerdt et al. 2013 Energy 63:61-75; Borenstein,
# Bushnell & Wolak 2000 J Ind Econ 48(2):197-223.

# meaning:  how the clearing price is derived
# unit:     "marginal_technology" (max price among dispatchables); the only
#           implemented value, anything else raises
# default:  marginal_technology
# source:   —
# status:   gated-by:enable_mcpr
mcpr_method: "marginal_technology"

# meaning:  multiplier on the marginal cost to form the clearing price
# unit:     float > 0; 1.0 = no extra markup
# default:  1.0
# source:   —
# status:   gated-by:enable_mcpr
mcpr_markup_factor: 1.0

# meaning:  merit-order price elasticity: clearing price falls by alpha per
#           1 pp of VRE share
# unit:     fraction per percentage point
# default:  0.006 (−0.6 % per pp)
# source:   IMF WP 2022/220
# status:   gated-by:mcpr_mode=merit_order_decline (paper-track only)
mcpr_merit_order_alpha: 0.006

# meaning:  floor on the merit-order clearing price as a share of the
#           original price (scarcity rents)
# unit:     fraction [0, 1]
# default:  0.5
# source:   —
# status:   gated-by:mcpr_mode=merit_order_decline (paper-track only)
mcpr_merit_order_floor: 0.5

# meaning:  compute VRE value factors from VRE capacity share per
#           (geography, year, scenario_type) instead of static defaults:
#             Solar PV      VF = max(1.10 − 1.5·s, 0.40)
#             Wind onshore  VF = max(1.05 − 0.8·s, 0.50)
#             Wind offshore VF = max(1.07 − 0.7·s, 0.55)
#             Solar CSP     VF = max(1.05 − 0.3·s, 0.80)
#             Dispatchable  VF = 1.0
#           The coefficients are hardcoded in earnings_model/nodes.py.
#           Overrides static AND regional value factors when True.
# unit:     bool
# default:  False
# source:   Hirth 2013; Halttunen et al. 2022
# status:   gated-by:enable_mcpr
enable_dynamic_capture_ratios: False

# meaning:  use geography-specific VRE value factors from
#           mcpr_regional_value_factors instead of the uniform defaults
#           (Hirth 2013 table 1: PV 0.85, wind onshore 0.90, offshore 0.92,
#           CSP 0.95, hardcoded in earnings_model/nodes.py)
# unit:     bool
# default:  False
# source:   Hirth 2013; Halttunen et al. 2022; S&P Global 2025
# status:   gated-by:enable_mcpr
enable_regional_mcpr_vf: False

# meaning:  regional VRE value factors, three tiers by VRE penetration:
#           tier 1 (>20 %) EU, PAC_OECD — aggressive cannibalisation;
#           tier 2 (8-20 %) USA, China, India, Japan, LatAm;
#           tier 3 (<8 %) Middle East, Africa, Indonesia, Ref Econ — near 1.0
# unit:     fraction (0, 1.5] per geography × technology (values above 1 are
#           legitimate at low VRE penetration)
# default:  see table
# source:   Hirth 2013; Halttunen et al. 2022; S&P Global 2025
# status:   gated-by:enable_regional_mcpr_vf
mcpr_regional_value_factors:
  # Tier 1: High VRE (>20%) — strong cannibalization observed empirically
  R10EUROPE:
    "SolarCap - PV": 0.75
    "WindCap - Onshore": 0.87
    "WindCap - Offshore": 0.90
  "OECD & EU (R5)":
    "SolarCap - PV": 0.80
    "WindCap - Onshore": 0.88
    "WindCap - Offshore": 0.91
  R10PAC_OECD:
    "SolarCap - PV": 0.80
    "WindCap - Onshore": 0.88
    "WindCap - Offshore": 0.91
  EU:
    "SolarCap - PV": 0.75
    "WindCap - Onshore": 0.87
    "WindCap - Offshore": 0.90

  # Tier 2: Moderate VRE (8-20%) — current defaults appropriate
  R10NORTH_AM:
    "SolarCap - PV": 0.82
    "WindCap - Onshore": 0.90
    "WindCap - Offshore": 0.92
  USA:
    "SolarCap - PV": 0.82
    "WindCap - Onshore": 0.90
    "WindCap - Offshore": 0.92
  CHN:
    "SolarCap - PV": 0.85
    "WindCap - Onshore": 0.90
    "WindCap - Offshore": 0.92
  "R10CHINA+":
    "SolarCap - PV": 0.85
    "WindCap - Onshore": 0.90
    "WindCap - Offshore": 0.92
  IND:
    "SolarCap - PV": 0.90
    "WindCap - Onshore": 0.93
    "WindCap - Offshore": 0.95
  "R10INDIA+":
    "SolarCap - PV": 0.90
    "WindCap - Onshore": 0.93
    "WindCap - Offshore": 0.95
  JPN:
    "SolarCap - PV": 0.88
    "WindCap - Onshore": 0.92
    "WindCap - Offshore": 0.93
  R10LATIN_AM:
    "SolarCap - PV": 0.90
    "WindCap - Onshore": 0.93
    "WindCap - Offshore": 0.95
  BRA:
    "SolarCap - PV": 0.90
    "WindCap - Onshore": 0.93
    "WindCap - Offshore": 0.95

  # Tier 3: Low VRE (<8%) — minimal cannibalization, VF approaches 1.0
  R10MIDDLE_EAST:
    "SolarCap - PV": 0.97
    "WindCap - Onshore": 0.98
    "WindCap - Offshore": 0.98
  R10AFRICA:
    "SolarCap - PV": 0.95
    "WindCap - Onshore": 0.97
    "WindCap - Offshore": 0.97
  ZAF:
    "SolarCap - PV": 0.93
    "WindCap - Onshore": 0.95
    "WindCap - Offshore": 0.96
  IDN:
    "SolarCap - PV": 0.95
    "WindCap - Onshore": 0.97
    "WindCap - Offshore": 0.97
  R10REST_ASIA:
    "SolarCap - PV": 0.93
    "WindCap - Onshore": 0.95
    "WindCap - Offshore": 0.96
  R10REF_ECON:
    "SolarCap - PV": 0.97
    "WindCap - Onshore": 0.98
    "WindCap - Offshore": 0.98
  RUS:
    "SolarCap - PV": 0.97
    "WindCap - Onshore": 0.98
    "WindCap - Offshore": 0.98

# meaning:  keep charging fixed O&M on capacity frozen at retirement in the
#           baseline leg
# unit:     bool
# default:  False
# source:   —
# status:   advanced
apply_continued_om_baseline: False

# meaning:  keep charging fixed O&M on stranded (frozen) capacity in the
#           shock leg
# unit:     bool
# default:  True
# source:   —
# status:   advanced
apply_continued_om_shock: True

# meaning:  marginal emission factor declines with VRE share,
#           marginal_ef(t) = marginal_ef_static · (1 − vre_share(t))²
#           (quadratic: gas starts paying at ~34 % VRE; linear would be 56 %)
# unit:     bool
# default:  True (RC5 fix)
# source:   —
# status:   advanced — only active under enable_mcpr=True AND
#           carbon_cost_method=differential_ef (see earnings_model/nodes.py
#           note); inert under the shipped full_ef configuration
dynamic_marginal_ef: True

# --------------------------------------------- promoted from code 2026-09-06
# Defaults equal the constants previously hardcoded in earnings_model/nodes.py,
# so results are unchanged unless you edit them.

# meaning:  routine replacement capex charged each year as a share of
#           operating capacity (× capex_usd_per_mw)
# unit:     fraction per year; utility benchmark 0.01-0.03
# default:  0.02
# source:   EPRI; Lazard LCOE methodology
# status:   gated-by:include_replacement_capex
replacement_capex_rate: 0.02

# meaning:  decommissioning cost per retired MW as a share of capex_usd_per_mw
# unit:     fraction >= 0
# default:  0.5
# source:   —
# status:   gated-by:include_decom_costs
decom_cost_share_of_capex: 0.5

# meaning:  capacity factor used when the scenario reports none
# unit:     fraction (0, 1], or null to fail the run on any missing value
# default:  1.0 — historical behaviour (missing = 100 % utilisation);
#           null is recommended for new studies
# source:   —
# status:   advanced
default_capacity_factor: 1.0

# meaning:  technologies eligible to set the market clearing price (max
#           price among them) and the marginal emission factor
# unit:     list of technology names as in the scenario data
# default:  dispatchable fossil and biomass
# source:   —
# status:   gated-by:enable_mcpr
mcpr_marginal_technologies:
  - GasCap
  - CoalCap
  - OilCap
  - BiomassCap

# meaning:  MCPR may only LIFT prices toward the clearing price (floor at the
#           IAM price); False lets it lower VRE prices too
# unit:     bool
# default:  True
# source:   —
# status:   gated-by:enable_mcpr
mcpr_floor_at_iam_price: True

# meaning:  uniform value factors applied to the clearing price per technology
#           (used unless enable_regional_mcpr_vf or
#           enable_dynamic_capture_ratios is True)
# unit:     fraction (0, 1.5] per technology (values above 1 are legitimate at
#           low VRE penetration; validated in PARAMETER_SPEC)
# default:  Hirth 2013 table 1, "Review" column, 10-20 % penetration
# source:   Hirth 2013 Energy Econ 38:218-236
# status:   gated-by:enable_mcpr
mcpr_value_factors:
  "WindCap - Onshore": 0.90
  "WindCap - Offshore": 0.92
  "SolarCap - PV": 0.85
  "SolarCap - CSP": 0.95
  GasCap: 1.0
  GasCap_w/o CCS: 1.0
  GasCap_w/ CCS: 1.0
  CoalCap: 1.0
  CoalCap_w/o CCS: 1.0
  CoalCap_w/ CCS: 1.0
  OilCap: 1.0
  OilCap_w/o CCS: 1.0
  OilCap_w/ CCS: 1.0
  NuclearCap: 1.0
  HydroCap: 1.0
  GeothermalCap: 1.0
  BiomassCap: 1.0
  BiomassCap_w/o CCS: 1.0
  BiomassCap_w/ CCS: 1.0
