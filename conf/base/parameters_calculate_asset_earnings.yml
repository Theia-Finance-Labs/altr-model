# Asset earnings parameters.
#
# Part of ALTR's six-file parameter namespace; the run-configuration entry point is
# `parameters_prepare_scenario_asset_and_company_inputs.yml`.

# Share of the differential carbon cost passed through to customers, 0.0–1.0.
market_passthrough: 0  # 0 => firm absorbs all differential carbon cost (conservative/stress test)

# ── Carbon cost ───────────────────────────────────────────────────────────────────
# How emission factors enter the carbon cost.
#   "full_ef"         — cost = Q × cp × EF. Every technology pays for everything it
#                       emits. Right for IAMs whose electricity prices barely move
#                       with carbon stringency (WITCH: a $9/MWh C1→C7 price spread
#                       against a $722/tCO2 carbon-price difference), so there is no
#                       embedded carbon to double-count.
#   "differential_ef" — cost = Q × cp × max(EF − marginal_EF, 0): only the excess
#                       over the price-setting generator. Right for IAMs whose
#                       prices already embed the marginal generator's carbon cost
#                       (AIM/CGE: a $64/MWh spread).
#
# The key reads marginal_EF, which the market-clearing-price adjustment
# produced. That adjustment is retired here (2026-09-01 owner ruling), so
# marginal_EF is 0 on today's inputs and the two methods coincide. Kept so the
# differential path works if the adjustment ever returns, and tested against an
# injected non-zero marginal EF so the switch is not carried untested.
#
# A companion key, `dynamic_marginal_ef`, decayed marginal_EF with the VRE
# capacity share. It was deleted by owner ruling 14: it scaled a value that is
# always zero, so it could not change a number, and its (1 - vre_share)² curve
# was an untested assumption sitting in the tree waiting to become live.
carbon_cost_method: "full_ef"

# ── Cost switches ─────────────────────────────────────────────────────────────────
# Which cost elements the earnings model charges to free cash flow (True/False).
include_growth_capex: False        # OFF: IAM O&M already bundles annualized capital costs (REMIND/WITCH/POLES)
# Replacement CapEx (`include_replacement_capex` / `replacement_capex_rate`, a
# 2%/yr roll-over charge on standing real capacity priced at the year's
# new-build cost) was REMOVED on 2026-09-04 by owner ruling: the reasoning that
# keeps growth CapEx off applies to it equally, so it double-counted capital
# upkeep already inside IAM O&M. Standing capacity now carries no annual capital
# charge; the only CapEx events are synthetic build-out and retirement.
# Decommissioning costs on retired capacity. `scrap_usd_per_mw` arrives negative
# (= -capex/2); it is charged as a POSITIVE outflow, so retiring an asset costs
# money rather than paying the owner.
include_decom_costs: True          # Include decommissioning costs for retired assets
# The rate itself (delivered as -capex/2) is recalibrated, if at all, by
# `decom_cost_fraction_of_capex` in parameters_prepare_scenario_asset_and_company_inputs.yml.

# ── Continued O&M ─────────────────────────────────────────────────────────────────
# When enabled for a trajectory type, fixed O&M is charged on that trajectory's
# FIRST-YEAR capacity for every year rather than on the year's actual capacity — so
# a retiring asset keeps paying fixed costs it can no longer earn against. Enabling
# it on the shock side only (the default) is what makes stranding bite in the shock
# pathway without also penalising the baseline. Applies ONLY to
# decreasing-technology (high-carbon alignment) assets on the covered
# trajectory; every other row is charged on actual capacity regardless.
apply_continued_om_baseline: False
# The single biggest stranding lever: on the fixture slice, turning this off
# moves the median npv_change from -0.42 to -0.16. Same first-year-capacity
# mechanics as the baseline switch above, applied to the shock pathway.
apply_continued_om_shock: True

# ── Dispatch floor ────────────────────────────────────────────────────────────────
# The scenarios carry one annual-average price per region-year, so a fuelled
# plant is otherwise paid that average in every hour and books fuel burnt at a
# loss whenever the average sits below its own fuel cost (WITCH baseline: 34% of
# gas and 78% of oil asset-years). No operator does that: a dispatchable plant
# runs only in hours where the price covers its fuel, so the hours the scenario
# says it runs carry a price of at least its own variable cost.
# Values: "none" (DEFAULT, owner ruling 2026-09-05) - the average price as
#         delivered, the validated behaviour.
#         "own_variable_cost" - the captured price (after any capture factor) is
#         bounded below by fuel_price / efficiency for plants with fuel. Energy
#         margins can then not be negative; fixed O&M and capex are still paid,
#         and a plant without fuel is never touched. Parameter-free.
# Measured offline on the golden run (operating coverage): gas 0.925 -> 1.033,
# oil 0.33 -> 0.88, biomass 0.83 -> 0.86; nothing else moves.
dispatch_floor: none
