# Scenario filtering, ownership allocation, and asset/company preparation.
#
# Documentation for this file format can be found in "Parameters"
# Link: https://docs.kedro.org/en/0.19.12/configuration/parameters.html
#
# ==================================================================================
# ALTR run configuration — this is the file you normally touch
# ==================================================================================
# Kedro merges every `conf/base/parameters*.yml` file into ONE flat namespace, so a
# key may be defined in exactly one base file (a duplicate breaks the run). ALTR
# splits that namespace across six per-pipeline files; this one holds scenario
# selection and run scope, which is where most runs are configured. Timing lives in
# `parameters_calculate_company_trajectories.yml` and the cost switches in
# `parameters_calculate_asset_earnings.yml`.
#
# Any value here can be overridden per environment in `conf/<env>/parameters*.yml`
# (e.g. `conf/fixture/` for the small committed regression slice).
# ==================================================================================


# ── Scenario selection ────────────────────────────────────────────────────────────
# The scenario pair the run compares: `baseline_scenario` is the counterfactual
# (current-policy) pathway; `target_scenario` is the climate-policy pathway whose
# "late & sudden" alignment drives the shock.
# Values: full scenario names as they appear in the `scenario` column of the
# scenarios input (`data/05_model_input/scenarios.csv`). Both must come from the
# same IAM provider and start in the same year (asserted in `filter_assets`).
# NOTE (corrected 2026-09-02): `filter_scenarios` does NOT prepend
# "AR6_<provider>_" -- it asserts the name below appears VERBATIM in the
# `scenario` column and performs no prefixing at all
# (`_input_nodes.py::filter_scenarios`). The committed fixture stores full names
# ("AR6_WITCH 5.0_EN_NoPolicy") for exactly this reason. If your scenarios
# extract carries bare names, the prefix must be restored during staging --
# `scripts/stage_marts_inputs.py` does it.
# Known pairs per IAM: see docs/handover/scenario_catalog.md
# The shipped AIM/CGE pair (`EN_NPi2020_1200f` / `EN_NPi2020_900f`) is NOT in the
# 2026-09-01 scenarios extract -- AIM/CGE 2.2 appears there as
# `EN_INDCi2100` / `EN_NPi2020_500f`. This WITCH pair is the documented
# equivalent already used by the committed fixture slice
# (`conf/fixture/parameters_prepare_scenario_asset_and_company_inputs.yml`), and
# is the best-covered pair in the extract: 9,360 rows each, 26 years, 20
# geographies, 18 technologies, with a target carbon price ramping 0 -> 722
# USD/tCO2 against a flat-zero baseline.
baseline_scenario: "AR6_WITCH 5.0_EN_NoPolicy"
target_scenario: "AR6_WITCH 5.0_EN_NPi2020_500"

# ── Ownership tier ────────────────────────────────────────────────────────────────
# Which rung of the ownership tree attaches assets to companies.
# Values: whatever the companies input's tier column actually holds. The column
# comes from the marts export; under the NAMED schema (`ownership_type`) its
# values there are "direct" and "equity" — not "indirect". Under the NUMBERED
# schema (`ownership_level`) "direct" selects level 1, "indirect"/"equity"
# select level 2+, and a bare number selects that level; anything else raises
# rather than being taken as "some indirect rung".
# Matching ignores case and surrounding whitespace on both sides.
# The 2026-08-25 deliverables drop carries NEITHER column, and
# `scripts/prepare_inputs.py` refuses such a file rather than letting every rung
# of the ownership chain into the run: a re-export including `ownership_type`
# is required before that drop can be converted.
# A tier the data does not carry is rejected with a ValueError listing the
# values that are available, rather than silently emptying the run.
# A company's stake in an asset is recorded at several tiers — a direct holding
# and the equity stakes rolling up through subsidiaries. They are alternative
# views of the same capacity, not additive ones, so a run reports on one tier.
# The tier is selected BEFORE stakes are consolidated, so consolidation only ever
# sums within the tier it was given.
# Read only when `ownership_aggregation` is "tier_filter" (the default); "sum"
# keeps every tier and ignores this key.
ownership_type: "direct"

# ── Ownership aggregation ─────────────────────────────────────────────────────────
# How the several stakes one company holds in one asset-year are combined.
# Values: "tier_filter" (DEFAULT) | "sum".
#   "tier_filter" — select the `ownership_type` rung above, then consolidate the
#     duplicate stakes WITHIN that rung into one row per company-asset-year. The
#     tiers are alternative views of the same capacity, so only one is reported.
#     This is the validated baseline: it is the behaviour the pinned fixture NPVs
#     and last year's published results were produced under.
#   "sum" — total every holding: direct + equity per company-asset-year, all
#     tiers entering. This is TRISK's reading, and the mode to pick when results
#     have to line up with a TRISK run.
# Absolute outputs are NOT comparable across the two modes. On the fixture slice
# one company holds a plant at 50.00% direct and 0.45% equity: "tier_filter"
# gives it 50.00%, "sum" gives it 50.45%, and the owner-asset universe grows
# roughly 2.2× under "sum" — every absolute number (NPV, earnings, capacity)
# scales with it. Only within-mode comparisons mean anything.
ownership_aggregation: "tier_filter"


# ── Output granularity ────────────────────────────────────────────────────────────
# True collapses asset-level results up to one row per company before the earnings
# model runs; False keeps every asset distinct. Company-level runs are much cheaper
# but lose the per-asset retirement and staggering detail the plots draw on.
reduce_granularity_from_asset_to_company_level: False


# ── Scope filters ─────────────────────────────────────────────────────────────────
# Number of forecast years kept per asset, counted from the scenario start year:
# assets are filtered to production years in [start_year, start_year + N] (years).
max_forecast_horizon: 5

# Technology scenario mapping control
# If True, use w/ CCS scenarios for Coal, Gas, Biomass. If False, use w/o CCS
# If Null, use technology without distinction.
ccs_on: False


# Empty list = all companies (no filter).
# Values: list of company_id strings present in the companies input. Read the ids
# you can choose from off the `company_id` column of your own companies input
# (`data/05_model_input/companies_ownerships.csv`); the list below is an example
# selection, not a required one.
# FULL-UNIVERSE RUN (2026-09-02): emptied to lift the 30-company example
# filter. The shipped list is documented above as "an example selection, not a
# required one"; the golden baseline is pinned on the whole universe.
company_ids: []
