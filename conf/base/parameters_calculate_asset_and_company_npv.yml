# Asset and company NPV parameters
dcf:
  # Discount rate configuration
  # Baseline scenarios use standard discount rate
  discount_rate_baseline: 0.07  # 7% real discount rate for baseline pathways

  # The shock-pathway rate. It ships EQUAL to the baseline rate, so no discount
  # premium is applied: the shipped configuration values the two pathways at the
  # same 7%, and the whole baseline-vs-shock difference comes from the cash
  # flows, not from the rate. Raise it here to price transition risk into the
  # rate as well — regulatory uncertainty, stranded-asset risk, market
  # volatility and policy-implementation risk are the usual grounds.
  # NOTE: with `price_ramp: True` this key is INERT — see the user guide's
  # "Discount rates" section and the stage-5 pipeline page.
  discount_rate_shock: 0.07  # 7% real discount rate for transition shock pathways

  # ── Technology-differentiated discount rates ────────────────────────────────
  # The empirical carbon risk premium: high-emission firms face roughly 1.5-2.5%
  # higher equity returns (Bolton & Kacperczyk 2021, 2023), which translates to a
  # 60-150 bps WACC spread. Shell's 2024 annual report uses 7.5% for oil & gas
  # against 6.0% for renewables — a 150 bps spread. Set both to 0 for uniform
  # rates. Added to / subtracted from the scenario base rate above.
  brown_discount_spread: 0.01   # +100 bps carbon risk premium on carbontech
  green_discount_spread: 0.005  # -50 bps greenium on greentech

  # Terminal value configuration
  terminal_value:
    method: "perpetuity"  # "none" | "perpetuity"
    g_real_default: 0.02  # 2% real terminal growth rate (fallback)
    g_real_brown: 0.0     # 0% for carbontech — declining assets, no perpetual growth
    g_real_green: 0.02    # 2% for greentech — growing clean energy cash flows

    # How many final years are averaged into the terminal FCFF. Terminal value
    # should rest on normalized, sustainable cash flow, not on whatever the last
    # forecast year happened to be — a single transition-period CapEx spike can
    # otherwise erase an asset's entire terminal value.
    #   1 — last year only
    #   3 — recommended (Damodaran / McKinsey / CFA practice)
    #   5 — heavier smoothing for volatile transition scenarios
    normalization_window: 3

  # ── Stranding-aware terminal value (Gourdel 2024) ───────────────────────────
  # Three tiers instead of one perpetuity for every asset:
  #   1. STRANDED — FCFF <= 0 for the last N years: TV = 0. A rational owner
  #      exercises the abandonment option rather than funding perpetual losses.
  #   2. DECLINING BUT PROFITABLE CARBONTECH — TV = a finite annuity over
  #      brown_remaining_life_years, reflecting a fossil asset's finite remaining
  #      economic life in a transition, rather than a growing perpetuity.
  #   3. EVERYTHING ELSE — standard Gordon Growth perpetuity, unchanged.
  stranding_aware_tv: True
  stranding_consecutive_years: 3   # a company weathers 1-2 bad years, not N in a row
  brown_remaining_life_years: 10   # annuity horizon for tier 2
