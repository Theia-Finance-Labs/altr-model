# DCF/Valuation model parameters  
dcf:
  # Basis consistency - must match earnings pipeline
  basis: "real"  # "real" or "nominal" 
  base_year: 2010  # if basis="real"
  use_after_tax_wacc: false  # RFC: set true when enabling corporate taxes
  
  # Simplified discount rate configuration
  # Baseline scenarios use standard discount rate
  discount_rate_baseline: 0.07  # 7% real discount rate for baseline pathways
  
  # Shock scenarios use higher discount rate due to transition risk
  # Higher rate reflects: regulatory uncertainty, stranded asset risks, 
  # market volatility during energy transition, policy implementation risks
  discount_rate_shock: 0.08  # 8% real discount rate for transition shock pathways (1% risk premium)
  
  # Terminal value configuration
  terminal_value:
    method: "perpetuity"  # "none" | "perpetuity" | "fade_to_zero"
    g_real_default: 0.02  # 2% real terminal growth rate
    g_nominal_default: 0.04  # 4% nominal terminal growth rate (if basis="nominal")
    fade_years: 5  # Only used if method="fade_to_zero" 
    include_salvage: false
    
  # Salvage values (only used if include_salvage=true)
  salvage:
    usd_per_mw_by_tech:
      default: 0
      Solar: 10000
      Wind: 15000
      Nuclear: 50000
      Coal: 5000
      Gas: 8000
  
  # Output components for analysis
  include_pv_components: true  # Include PV of EBITDA, CapEx, etc. for attribution
  
  # Baseline scenario identification for delta calculations
  baseline_filter:
    scenario_provider: "AR6_WITCH 5.0"  # Match your existing naming convention
    scenario: "EN_INDCi2030_1000_NDCp"  # Your baseline scenario name
    scenario_type: "baseline"
  
  # Aggregation levels to produce
  aggregation_levels:
    - "company_id"
    - "scenario_provider" 
    - "scenario"
    - "scenario_type"
  
  # Reporting configuration
  report_topn_companies: 50