# DCF/Valuation model parameters
dcf:
  # Discount rate configuration
  # Baseline scenarios use standard discount rate
  discount_rate_baseline: 0.07  # 7% real discount rate for baseline pathways

  # Shock scenarios use higher discount rate due to transition risk
  # Higher rate reflects: regulatory uncertainty, stranded asset risks,
  # market volatility during energy transition, policy implementation risks
  discount_rate_shock: 0.07  # 7% real discount rate for transition shock pathways

  # Technology-differentiated discount rates (Bolton & Kacperczyk 2021, 2023)
  # Reflects the empirical carbon risk premium: high-emission firms face ~1.5-2.5%
  # higher equity returns. Translates to ~60-150 bps WACC spread.
  # Shell 2024 Annual Report: 7.5% O&G vs 6.0% renewables (150 bps spread).
  # Set both to 0 for uniform rates (backward-compatible).
  brown_discount_spread: 0.01   # D1 fix: +100 bps carbon risk premium (Bolton & Kacperczyk 2021)
  green_discount_spread: 0.005  # D1 fix: -50 bps greenium (Shell 2024: 150bps spread O&G vs renewables)

  # Terminal value configuration
  terminal_value:
    method: "perpetuity"  # "none" | "perpetuity"
    g_real_default: 0.02  # 2% real terminal growth rate (used when tech-specific rates are null)
    g_real_brown: 0.0     # 0% for carbontech — declining assets, no perpetual growth
    g_real_green: 0.02    # 2% for greentech — growing clean energy cash flows

    # Normalization window for terminal FCFF (Damodaran/McKinsey/CFA best practice)
    # Terminal value should use "normalized, sustainable steady-state" cash flows,
    # not raw final-year figures which may contain transition-period CapEx spikes.
    # N=1: last year only (original behavior)
    # N=3: recommended — averages last 3 years, smooths CapEx volatility
    # N=5: more aggressive smoothing for highly volatile transition scenarios
    normalization_window: 3

  # Stranding-aware terminal value (D2 fix — Gourdel 2024)
  # Three-tier terminal value based on asset economic state:
  #   1. STRANDED: last N years FCFF <= 0 → TV = 0 (abandonment option exercised)
  #      Based on Gourdel's max(profit - carbon_cost, 0) real options logic.
  #   2. DECLINING CARBONTECH: still profitable → TV = finite annuity (not perpetuity)
  #      Reflects finite remaining economic life of fossil assets in transition.
  #   3. GREENTECH / GROWING: standard Gordon Growth perpetuity (unchanged).
  stranding_aware_tv: True         # D2: Gourdel (2024) three-tier TV
  stranding_consecutive_years: 3   # N consecutive loss-making years at terminal → stranded
  brown_remaining_life_years: 10   # Finite annuity horizon for profitable carbontech
