# ================================================
# ================== INPUTS ======================
# ================================================

# scenarios / assets_forecasts / companies_ownerships below are the model's actual inputs.
# Maintainers with BigQuery access produce them via
# `python src/altr_model/bigquery_marts_downloader.py`; everyone else
# receives these three CSVs through another channel and places them here.

# ================================================
# ================== INTERMEDIATE ================
# ================================================

scenarios:
  type: pandas.CSVDataset
  filepath: data/05_model_input/scenarios.csv

assets_forecasts:
  type: pandas.CSVDataset
  filepath: data/05_model_input/assets_forecasts.csv

companies_ownerships:
  type: pandas.CSVDataset
  filepath: data/05_model_input/companies_ownerships.csv

# ================================================
# ================== OUTPUTS =====================
# ================================================

# Canonical company trajectories: baseline, target, requested transition,
# and the post-allocation transition realized by the asset fleet.
company_trajectories:
  type: pandas.CSVDataset
  filepath: data/07_model_output/company_trajectories.csv

# Canonical long asset trajectories used by the earnings model.
asset_trajectories:
  type: pandas.CSVDataset
  filepath: data/07_model_output/asset_trajectories.csv


# ================================================
# ======= EARNINGS MODEL PIPELINE OUTPUTS =======
# ================================================

# Asset-level earnings with comprehensive financial methodology
asset_earnings:
  type: pandas.CSVDataset
  filepath: data/07_model_output/asset_earnings.csv

# # Company-technology level aggregated earnings
# company_technology_earnings:
#   type: pandas.CSVDataset
#   filepath: data/07_model_output/company_technology_earnings.csv

# # Company level aggregated earnings
# company_earnings:
#   type: pandas.CSVDataset
#   filepath: data/07_model_output/company_earnings.csv

# ================================================
# ================== VALUATION MODEL OUTPUTS ===
# ================================================

yearly_npv_trajectories:
  type: pandas.CSVDataset
  filepath: data/07_model_output/yearly_npv_trajectories.csv

asset_npv:
  type: pandas.CSVDataset
  filepath: data/07_model_output/asset_npv.csv

company_technology_npv:
  type: pandas.CSVDataset
  filepath: data/07_model_output/company_technology_npv.csv

company_npv:
  type: pandas.CSVDataset
  filepath: data/07_model_output/company_npv.csv

