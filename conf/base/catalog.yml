# ================================================
# ================== INPUTS ======================
# ================================================

# downloaded_scenarios / downloaded_assets / downloaded_companies below are
# the model's actual inputs. Maintainers with BigQuery access produce them
# via `python src/crispy_kedro/bigquery_marts_downloader.py`; everyone else
# receives these three CSVs through another channel and places them here.

# ================================================
# ================== INTERMEDIATE ================
# ================================================

downloaded_scenarios:
  type: pandas.CSVDataset
  filepath: data/05_model_input/downloaded_scenarios.csv

downloaded_assets:
  type: pandas.CSVDataset
  filepath: data/05_model_input/downloaded_assets.csv

downloaded_companies:
  type: pandas.CSVDataset
  filepath: data/05_model_input/downloaded_companies.csv

# ================================================
# ================== OUTPUTS =====================
# ================================================

# Key output from TRISK pipeline - this will be logged to MLflow
companies_npvs:
  type: pandas.CSVDataset
  filepath: data/08_reporting/companies_npvs.csv

# Combined late sudden trajectories and alignment classifications
companies_late_sudden_trajectories:
  type: pandas.CSVDataset
  filepath: data/07_model_output/companies_late_sudden_trajectories.csv

asset_level_staggered_shock:  
  type: pandas.CSVDataset
  filepath: data/07_model_output/asset_level_staggered_shock.csv

# Frozen capacity at retirement for fixed cost calculations
frozen_capacity_at_retirement:
  type: pandas.CSVDataset
  filepath: data/07_model_output/frozen_capacity_at_retirement.csv


# ================================================
# ======= EARNINGS MODEL PIPELINE OUTPUTS =======
# ================================================

# Asset-level earnings with comprehensive financial methodology
asset_earnings:
  type: pandas.CSVDataset
  filepath: data/07_model_output/asset_earnings.csv

