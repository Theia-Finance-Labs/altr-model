# AR6 scenario database — used for carbon price injection
# Contains carbon prices for IAMs that report them (WITCH, REMIND, IMAGE, etc.)
# See ALTR_NPV_Direction_Fix_Research.md for IAM-specific carbon price strategy
ar6_carbon_prices:
  type: pandas.CSVDataset
  filepath: 6_final_AR6_viable_scenarios.csv
  load_args:
    usecols:
      - scenario_provider
      - scenario
      - scenario_geography
      - scenario_year
      - carbon_price_usd_per_tco2

# ================================================
# ================== INTERMEDIATE ================
# ================================================

# Use the extended AR6 scenario file with cost columns (fuel_price, capex, O&M, etc.)
# The raw BigQuery scenarios table only has prices/pathways/capacity_factors.
