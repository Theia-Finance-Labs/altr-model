# Asset retirement and company-to-asset allocation controls.
#
# Documentation for this file format can be found in "Parameters"
# Link: https://docs.kedro.org/en/0.19.12/configuration/parameters.html


apply_retirement_baseline: True  # Apply retirement to baseline trajectories
apply_retirement_shock: True     # Apply retirement to shock (late sudden) trajectories
apply_decreasing_staggered_shock: False

# Read only when apply_decreasing_staggered_shock is True (it ships False).
staggered_shock:
  g_k: 6.0        # Steepness of the logistic age curve that orders which assets
                  # absorb the cut first; higher = the oldest quantile takes
                  # nearly everything before younger ones are touched.
  n_quantiles: 3  # Number of age buckets the fleet is split into for staggering.
