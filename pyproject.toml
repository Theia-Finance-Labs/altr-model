[project]
name = "crispy-kedro"
version = "0.1.0"
description = ""
authors = [{ name = "bertrand.gallice", email = "bertrandgllc@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    # TODO : bigquery here forces the use of numpy 1.26.1 .
    #  If needed to upgrade to numpy >= 2.0.0 one day, then look into ibis-bigquery package
    "ibis-framework[bigquery]>=10.4.0,<11.0.0",
    # TODO proto-plus is forced because only common version for google-cloud-bigquery-storage and google-api-core
    "proto-plus==1.22.3",
    "kedro>=0.19.12,<0.20.0",
    "pandas>=2.1,<2.2",
    "numpy>=1.26,<1.27",
    "kedro-datasets[pandas,ibis]>=6.0.0,<7.0.0",
    "matplotlib>=3.10.1,<4.0.0",
    "seaborn>=0.13.2,<0.14.0",
    "openpyxl>=3.1.5,<4.0.0",
    "kedro-viz>=11.0.0,<12.0.0",
    "tqdm>=4.67.1,<5.0.0",
    "joblib>=1.5.2,<2.0.0",
]

[project.scripts]
crispy-kedro = "crispy_kedro.__main__:main"
kedro = "kedro.framework.cli.cli:main"

[dependency-groups]
dev = [
    "ipython>=8.10",
    "jupyterlab>=3.0",
    "notebook",
    "pytest-cov~=3.0",
    "pytest-mock>=1.7.1,<2.0",
    "pytest~=7.2",
    "ruff~=0.1.8",
]
docs = [
    "docutils<0.21",
    "sphinx>=5.3,<7.3",
    "sphinx_rtd_theme==2.0.0",
    "nbsphinx==0.8.1",
    "sphinx-autodoc-typehints==1.20.2",
    "sphinx_copybutton==0.5.2",
    "ipykernel>=5.3,<7.0",
    "Jinja2<3.2.0",
    "myst-parser>=1.0,<2.1",
]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.hatch.build.targets.wheel]
packages = ["src/crispy_kedro"]

[tool.kedro]
package_name = "crispy_kedro"
project_name = "crispy-kedro"
kedro_init_version = "0.19.12"
tools = ["Linting", "Testing", "Documentation", "Data Structure"]
example_pipeline = false
source_dir = "src"

[tool.kedro_telemetry]
project_id = "0bec92a005924635896a5c2b9e02dc93"

[tool.pytest.ini_options]
addopts = """
--cov-report term-missing \
--cov src/crispy_kedro -ra"""

[tool.coverage.report]
fail_under = 0
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError"
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff]
line-length = 88
show-fixes = true
select = [
    "F",    # Pyflakes
    "W",    # pycodestyle warnings
    "E",    # pycodestyle errors
    "I",    # isort
    "UP",   # pyupgrade
    "PL",   # Pylint
    "T201"  # Print statement
]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
