[project]
name = "altr-model"
version = "0.1.0"
description = ""
authors = [{ name = "bertrand.gallice", email = "bertrandgllc@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "kedro>=0.19.12,<0.20.0",
    "pandas>=2.1,<2.2",
    "numpy>=1.26,<1.27",
    "kedro-datasets[pandas]>=6.0.0,<7.0.0",
    "matplotlib>=3.10.1,<4.0.0",
    "seaborn>=0.13.2,<0.14.0",
    "openpyxl>=3.1.5,<4.0.0",
    "kedro-viz>=11.0.0,<12.0.0",
    "tqdm>=4.67.1,<5.0.0",
    "joblib>=1.5.2,<2.0.0",
]

[project.scripts]
altr-model = "altr_model.__main__:main"
kedro = "kedro.framework.cli.cli:main"

[dependency-groups]
dev = [
    "ipython>=8.10",
    "jupyterlab>=3.0",
    "notebook",
    "pytest-cov~=3.0",
    "pytest-mock>=1.7.1,<2.0",
    "pytest~=7.2",
    "ruff~=0.1.8",
]
# Only needed to run bigquery_marts_downloader.py (maintainer-only input
# download). Not a default group: end users without BigQuery access never
# need these, so `uv sync` skips them unless explicitly requested with
# `uv sync --group bigquery`.
bigquery = [
    "google-cloud-bigquery>=3.43.0,<4.0.0",
    "google-cloud-bigquery-storage>=2.39.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]
# Only needed for the app under notebooks/streamlit/. Not a
# default group: `uv sync` skips it unless explicitly requested with
# `uv sync --group streamlit`.
streamlit = [
    "streamlit>=1.38,<2.0.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/altr_model"]

[tool.kedro]
package_name = "altr_model"
project_name = "altr-model"
kedro_init_version = "0.19.12"
tools = ["Linting", "Testing", "Data Structure"]
example_pipeline = false
source_dir = "src"

[tool.kedro_telemetry]
project_id = "0bec92a005924635896a5c2b9e02dc93"

[tool.pytest.ini_options]
addopts = """
--cov-report term-missing \
--cov src/altr_model -ra"""

[tool.coverage.report]
fail_under = 0
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError"
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff]
line-length = 88
show-fixes = true
select = [
    "F",    # Pyflakes
    "W",    # pycodestyle warnings
    "E",    # pycodestyle errors
    "I",    # isort
    "UP",   # pyupgrade
    "PL",   # Pylint
    "T201"  # Print statement
]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
