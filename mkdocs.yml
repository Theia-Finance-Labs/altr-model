# ALTR model documentation site.
#
# Build:   python -m mkdocs build --strict
# Preview: python -m mkdocs serve
#
# Deliberately repo-agnostic: no `repo_url`, no host-specific links, so the site
# builds identically wherever the package is checked out.

site_name: ALTR Model
site_description: Asset-level transition-risk valuation model — install, run, interpret.
docs_dir: docs/handover
site_dir: site
use_directory_urls: true

theme:
  name: material
  features:
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - User guide: user_guide.md
  - Parameters: parameters.md
  - Pipelines:
      - "Stage 1 — inputs_processing": pipelines/inputs_processing.md
      - "Stage 2 — inputs_postproc": pipelines/inputs_postproc.md
      - "Stage 3 — create_baseline_and_target_trajectories": pipelines/create_baseline_and_target_trajectories.md
      - "Stage 4 — create_late_sudden_trajectories": pipelines/create_late_sudden_trajectories.md
      - "Stage 5 — distribute_impacts_to_asset_level": pipelines/distribute_impacts_to_asset_level.md
      - "Stage 6 — earnings_model": pipelines/earnings_model.md
      - "Stage 7 — valuation_model": pipelines/valuation_model.md
      - "Stage 8 — reporting": pipelines/reporting.md
  # Architecture / data-flow diagram slots in here.
  - Scenario catalog: scenario_catalog.md
  - Troubleshooting: troubleshooting.md
